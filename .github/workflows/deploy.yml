# Teste et construit le site à chaque push et pull request ; ne publie sur GitHub Pages que depuis master.
# Prérequis (une fois) : Settings > Pages > Source = "GitHub Actions".
name: Déploiement GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas celui en cours.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Clé IndexNow (publique par conception) : le fichier public/<clé>.txt prouve la propriété du site.
  INDEXNOW_KEY: fa3fa270158ff024d7e53d6c8776333b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests du moteur fiscal
        run: npm test

      # next build vérifie aussi le lint et les types.
      - name: Construction du site statique
        run: npm run build
        env:
          # Le site est servi sous https://<compte>.github.io/<dépôt>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Configuration de Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Envoi du site construit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Signale les pages du sitemap à Bing (et Yandex, Seznam…) ; Google n'utilise pas IndexNow.
      # Un échec ici n'annule pas le déploiement.
      - name: Signalement des pages (IndexNow)
        continue-on-error: true
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          URLS=$(curl -fsS "${SITE}sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          HOST=$(echo "$SITE" | sed -E 's#^https?://([^/]+)/.*#\1#')
          BODY=$(jq -nc --arg host "$HOST" --arg key "$INDEXNOW_KEY" --arg loc "${SITE}${INDEXNOW_KEY}.txt" \
            --argjson urls "$URLS" '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          CODE=$(curl -sS -o reponse.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow : HTTP $CODE pour $(echo "$URLS" | jq length) URL"
          cat reponse.txt
          case "$CODE" in 200|202) ;; *) exit 1 ;; esac
